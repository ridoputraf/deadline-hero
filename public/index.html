<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6C3BFF" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171525" />
  <title>DeadLineHero</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="auth-view" class="view">
    <div class="auth-stage">
      <h1 class="brand">DeadLineHero</h1>

      <div class="auth-tabs" role="tablist" aria-label="Masuk atau daftar">
        <button class="tab-btn active" data-tab="login" type="button">Masuk</button>
        <button class="tab-btn" data-tab="register" type="button">Daftar</button>
      </div>

      <div class="flip-card">
        <div class="flip-card__inner">
          <div class="flip-card__front">
            <form id="login-form" class="auth-form" autocomplete="on">
              <h2 class="flip-title">Selamat datang kembali!</h2>
              <label>Email
                <input type="email" name="email" required placeholder="Tulis email kamu di sini" autocomplete="email" />
              </label>
              <label>Password
                <input type="password" name="password" required placeholder="Rahasia kamu, jangan dibagikan" autocomplete="current-password" />
              </label>
              <button type="submit" class="btn-3d btn-3d--primary"><span class="button_top">Masuk Sekarang</span></button>
            </form>
          </div>

          <div class="flip-card__back">
            <form id="register-form" class="auth-form" autocomplete="on">
              <h2 class="flip-title">Yuk, bikin akun barumu!</h2>
              <label>NPM
                <input type="text" name="npm" required inputmode="numeric" minlength="6" maxlength="10"
                  pattern="[0-9]{6,10}" placeholder="6-10 digit angka NPM kamu" autocomplete="off" />
              </label>
              <label>Nama Lengkap
                <input type="text" name="nama" required placeholder="Namanya dipanggil apa nih" autocomplete="name" />
              </label>
              <label>Email
                <input type="email" name="email" required placeholder="nama@emailkamu.com" autocomplete="email" />
              </label>
              <label>Password
                <input type="password" name="password" required placeholder="Buat yang gampang kamu inget" autocomplete="new-password" />
              </label>
              <label>Mau diingatkan lewat apa?
                <select id="pref-select" name="preferensi">
                  <option value="nada_dering" selected>Nada Dering</option>
                  <option value="nomor_wa">Chat WhatsApp ke orang terdekat</option>
                </select>
              </label>
              <div id="wa-extra" class="hidden">
                <label>Nomor WhatsApp-nya
                  <input type="tel" name="no_wa" placeholder="Contoh: 081234567890" autocomplete="tel" />
                </label>
                <label>Dia siapa buat kamu?
                  <select name="relasi">
                    <option value="pacar" selected>Pacar</option>
                    <option value="keluarga">Keluarga</option>
                    <option value="sahabat">Sahabat</option>
                  </select>
                </label>
              </div>
              <div id="ringtone-extra" class="hidden">
                <label>Pilih nada dering favoritmu
                  <select name="selected_ringtone">
                    <option value="/Sounds/ringtone1.mp3">Bruno Mars - Risk It All</option>
                    <option value="/Sounds/ringtone2.mp3">Naykilla - OBH Combi Sachet</option>
                    <option value="/Sounds/ringtone3.mp3">Sal Priadi - Foto Kita Blur</option>
                  </select>
                </label>
              </div>
              <button type="submit" class="btn-3d btn-3d--primary"><span class="button_top">Gas, Daftar!</span></button>
            </form>
          </div>
        </div>
      </div>

      <p id="auth-msg" class="msg" aria-live="polite"></p>
    </div>
  </div>

  <div id="app-view" class="view hidden">
    <header class="header-bar">
      <div class="header-inner">
        <div class="app-logo">DeadLineHero</div>
        <div class="profile-wrap">
          <button id="profile-trigger" class="profile-chip" type="button" aria-haspopup="true" aria-expanded="false">
            <div class="avatar" id="user-avatar">J</div>
            <div class="profile-info">
              <span id="user-nama" class="profile-nama">Nama</span>
              <span id="user-role" class="profile-role">user</span>
            </div>
          </button>
          <div id="menu-dropdown" class="menu-dropdown hidden" role="menu">
            <button type="button" data-action="change-password" role="menuitem">Ganti Password</button>
            <button type="button" data-action="change-email" id="menu-change-email" role="menuitem">Ganti Email</button>
            <button type="button" data-action="preferences" id="menu-preferences" role="menuitem">Ganti Pengingat</button>
            <button type="button" data-action="toggle-theme" role="menuitem">Dark Mode</button>
            <div class="menu-sep"></div>
            <button type="button" data-action="logout" class="danger" role="menuitem">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <section class="hero" aria-label="Sapaan">
        <h2 class="hero-title" id="hero-greeting">Halo, Hero!</h2>
      </section>

      <div class="card">
        <div class="tabs task-tabs" role="tablist">
          <button class="tab-btn active" data-task-tab="Tugas" type="button">Tugas</button>
          <button class="tab-btn" data-task-tab="UTS" type="button">UTS</button>
          <button class="tab-btn" data-task-tab="UAS" type="button">UAS</button>
        </div>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
        <p id="empty-msg" class="empty hidden">Masih kosong nih. Santai dulu, atau tunggu tugas baru masuk.</p>
      </div>

      <section id="admin-panel" class="admin-panel hidden">
        <h2>Input Tugas Baru</h2>
        <form id="task-form" class="task-form">
          <label>Judul
            <input type="text" name="judul" required />
          </label>
          <label>Deskripsi
            <textarea name="deskripsi" rows="3"></textarea>
          </label>
          <label>Kategori
            <select name="kategori" required>
              <option value="Tugas">Tugas</option>
              <option value="UTS">UTS</option>
              <option value="UAS">UAS</option>
            </select>
          </label>
          <label id="sumber-field">Sumber Web
            <select name="sumber_web">
              <option value="Vclass">Vclass</option>
              <option value="Ilab">Ilab</option>
              <option value="Praktikum">Praktikum</option>
            </select>
          </label>
          <label>Deadline
            <input type="datetime-local" step="1" name="deadline" required />
          </label>
          <button type="submit" class="btn-3d btn-3d--primary"><span class="button_top">Tambah Tugas</span></button>
        </form>
        <p id="task-msg" class="msg"></p>
      </section>

      <section id="modal-host"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="tasks" type="button">Daftar</button>
      <button class="nav-item" data-view="admin" id="nav-admin" type="button">Input</button>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
